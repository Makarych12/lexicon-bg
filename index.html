<!DOCTYPE html>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#080b10"/>

  <rect width="1400" height="920" fill="url(#bgGrad)"/>

  <rect x="2" y="2" width="1396" height="916" rx="10" fill="none" stroke="#1f2a36" stroke-width="2"/>
